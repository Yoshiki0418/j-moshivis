hydra:
  run:
    dir: /gpu-server/yamamoto/j-moshivis/logs/experiments/llmjp_v3_run1/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/gpu-server/yamamoto/j-moshivis/logs/experiments/llmjp_v3_run1/hydra
    - hydra.mode=RUN
    task:
    - paths.kyuteye_config=/gpu-server/yamamoto/j-moshivis/run_snapshots/llmjp_v3_run1_20260923/j-moshivis/configs/j-moshi-vis.yaml
    - paths.tokenizer=/gpu-server/yamamoto/j-moshivis/models/j-moshi/tokenizer_spm_32k_3.model
    - paths.moshivis_weight=/gpu-server/yamamoto/j-moshivis/models/model_merged_llmjp_bf16.safetensors
    - data.train_data=/gpu-server/yamamoto/j-moshivis/data/speech_v3/train.jsonl
    - data.eval_data=/gpu-server/yamamoto/j-moshivis/data/speech_v3/eval.jsonl
    - data.asset_manifest=/gpu-server/yamamoto/j-moshivis/data/speech_v3/asset_manifest.v1.jsonl
    - data.asset_manifest_verification=fast
    - data.shuffle=true
    - data.speech_ratio=0.25
    - data.speech_chunk_policy=one_random_crop_per_row
    - data.speech_decode_workers=4
    - train.batch_size=1
    - train.target_batch_size=16
    - train.learning_rate=5.0e-5
    - train.weight_decay=0.0
    - train.warmup_steps=500
    - train.max_steps=20000
    - train.min_lr_ratio=0.1
    - train.save_every=1000
    - train.keep_last=20
    - train.checkpoint_dir=/gpu-server/yamamoto/j-moshivis/checkpoints/llmjp_v3_run1
    - train.resume_from=null
    - train.log_interval=10
    - train.seed=42
    - train.num_workers=0
    - trainer.text_padding_weight=0.5
    - trainer.first_codebook_weight_multiplier=3.0
    - depformer.train=false
    - gate.freeze=false
    - gate.learning_rate=1.0e-4
    - cross_attention.visual_adapter_init=inherit_visual_adapter
  job:
    name: train
    chdir: null
    override_dirname: cross_attention.visual_adapter_init=inherit_visual_adapter,data.asset_manifest=/gpu-server/yamamoto/j-moshivis/data/speech_v3/asset_manifest.v1.jsonl,data.asset_manifest_verification=fast,data.eval_data=/gpu-server/yamamoto/j-moshivis/data/speech_v3/eval.jsonl,data.shuffle=true,data.speech_chunk_policy=one_random_crop_per_row,data.speech_decode_workers=4,data.speech_ratio=0.25,data.train_data=/gpu-server/yamamoto/j-moshivis/data/speech_v3/train.jsonl,depformer.train=false,gate.freeze=false,gate.learning_rate=1.0e-4,paths.kyuteye_config=/gpu-server/yamamoto/j-moshivis/run_snapshots/llmjp_v3_run1_20260923/j-moshivis/configs/j-moshi-vis.yaml,paths.moshivis_weight=/gpu-server/yamamoto/j-moshivis/models/model_merged_llmjp_bf16.safetensors,paths.tokenizer=/gpu-server/yamamoto/j-moshivis/models/j-moshi/tokenizer_spm_32k_3.model,train.batch_size=1,train.checkpoint_dir=/gpu-server/yamamoto/j-moshivis/checkpoints/llmjp_v3_run1,train.keep_last=20,train.learning_rate=5.0e-5,train.log_interval=10,train.max_steps=20000,train.min_lr_ratio=0.1,train.num_workers=0,train.resume_from=null,train.save_every=1000,train.seed=42,train.target_batch_size=16,train.warmup_steps=500,train.weight_decay=0.0,trainer.first_codebook_weight_multiplier=3.0,trainer.text_padding_weight=0.5
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /gpu-server/yamamoto/j-moshivis/run_snapshots/llmjp_v3_run1_20260923/j-moshivis
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /gpu-server/yamamoto/j-moshivis/run_snapshots/llmjp_v3_run1_20260923/j-moshivis/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /gpu-server/yamamoto/j-moshivis/logs/experiments/llmjp_v3_run1/hydra
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
