name: "実装・変更（コード／設定／文書）"
description: "リポジトリの変更を、専用ブランチとPRで進めます。"
title: "feat: "
labels:
  - "type:implementation"
  - "status:todo"
body:
  - type: markdown
    attributes:
      value: |
        タイトルは `prefix: 日本語タイトル`、ブランチは `prefix/Issue番号/english-kebab-case` とします。
        例: `feat: 対話の再生成を実装する` → `feat/10/gpt-dialogue-regeneration`。
        文書変更なら `docs`、不具合修正なら `fix` など、作業に合う接頭辞へ変更してください。
        `clean/refactor` と `remove/delete` は、それぞれ一方の語を選びます。`test` はテストコードの変更用です。

        **優先度の選択だけではラベルは付きません。** 作成者（人またはAI）が選択と一致する `priority:P0`〜`priority:P3` を1つだけ付けてください。
        [共通の運用ルール](https://github.com/Yoshiki0418/j-moshivis/blob/main/CONTRIBUTING.md)
  - type: textarea
    id: purpose
    attributes:
      label: "背景・目的"
      description: "どの問題を解決し、何ができるようになるかを記載してください。"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "変更範囲"
      description: "対象の機能・ファイル・設定や、必要な変更を記載してください。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "完了条件"
      description: "実装PRをマージして、このIssueを閉じられる条件を記載してください。"
      placeholder: "- [ ] 対象の動作を確認できる"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "検証方法"
      description: "必要なテスト・手動確認・確認用の成果物を記載してください。"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "優先度"
      description: "対応するpriorityラベルを1つだけ付けてください。"
      default: 2
      options:
        - "P0 — 即時対応が必要"
        - "P1 — 次に進める／期限や依存がある"
        - "P2 — 通常の優先度"
        - "P3 — 将来候補・低い優先度"
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: "依存・期限・担当"
      placeholder: |
        依存・関連Issue: #
        期限: 未設定
        担当: 未定
