name: "管理（複数Issueの取りまとめ）"
description: "子Issueの目的・依存関係・完了状況をまとめます。"
title: "chore: "
type: Task
labels:
  - "type:tracking"
  - "status:todo"
body:
  - type: markdown
    attributes:
      value: |
        子Issueを管理する親Issueは **Type** が `Task`、運用ラベルは `type:tracking` です。
        タイトルは `chore: 日本語タイトル` を基本とします。
        この管理Issue自体にはブランチ・PRを作らず、実装や実行は子Issueへ分けて追跡します。
        子Issueの完了と見送りの理由を確認した後に、このIssueを閉じます。

        **優先度の選択だけではラベルは付きません。** 作成者（人またはAI）が選択と一致する `priority:P0`〜`priority:P3` を1つだけ付けてください。
        [共通の運用ルール](https://github.com/Yoshiki0418/j-moshivis/blob/main/CONTRIBUTING.md)
  - type: textarea
    id: purpose
    attributes:
      label: "背景・目的"
      description: "全体として実現したいことと範囲を記載してください。"
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: "子Issue・実行順序"
      description: "子Issueをチェックリストでまとめ、依存関係や並行できる作業を記載してください。"
      placeholder: |
        - [ ] #番号 作業名

        実行順序:
        並行可能な作業:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "全体の完了条件"
      description: "子Issueの完了に加え、必要な結果確認や見送りの扱いを記載してください。"
      placeholder: "- [ ] 必須の子Issueが完了し、全体の結果を記録する"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "優先度"
      description: "対応するpriorityラベルを1つだけ付けてください。"
      default: 2
      options:
        - "P0 — 即時対応が必要"
        - "P1 — 次に進める／期限や依存がある"
        - "P2 — 通常の優先度"
        - "P3 — 将来候補・低い優先度"
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: "依存・期限・担当"
      placeholder: |
        関連する管理Issue: #
        期限: 未設定
        担当: 未定
