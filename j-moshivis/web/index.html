<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J-MoshiVis Realtime Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="stage">
        <div class="image-panel">
          <label class="image-drop" for="image-input">
            <img id="preview" alt="" />
            <span id="image-placeholder">画像を選択</span>
          </label>
          <input id="image-input" type="file" accept="image/*" />
        </div>

        <div class="conversation">
          <div class="topbar">
            <div>
              <h1>J-MoshiVis</h1>
              <p id="status">画像を選択して接続してください。</p>
            </div>
            <div class="connection-dot" id="connection-dot" title="connection"></div>
          </div>

          <div class="transcript" id="transcript" aria-live="polite"></div>

          <div class="gate-meter" title="cross-attention gate">
            <div id="gate-fill"></div>
          </div>

          <div class="controls">
            <button id="connect-button">接続</button>
            <button id="talk-button" disabled>話す</button>
            <button id="reset-button" disabled>リセット</button>
          </div>
        </div>
      </section>

      <section class="settings">
        <label>
          Text temp
          <input id="text-temp" type="number" min="0.1" max="2" step="0.1" value="0.5" />
        </label>
        <label>
          Audio temp
          <input id="audio-temp" type="number" min="0.1" max="2" step="0.1" value="0.5" />
        </label>
        <label>
          Text top-k
          <input id="text-topk" type="number" min="1" max="200" step="1" value="10" />
        </label>
        <label>
          Audio top-k
          <input id="audio-topk" type="number" min="1" max="500" step="1" value="250" />
        </label>
      </section>

      <p class="hint">
        ヘッドホン推奨です。マイクを止めると、数秒の無音を送って応答を最後まで生成します。
      </p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
